<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="End of transmission. Thanks for scrolling.">
<title>EOF</title>
<defs><style>
.m{font-family:'JetBrains Mono','Fira Code','SF Mono','Cascadia Code',Consolas,'Liberation Mono','Courier New',monospace;}
.hl{animation:hl 2.75s cubic-bezier(.6,0,1,.6) infinite;opacity:0;}
@keyframes hl{0%{transform:translateY(70px);opacity:0}15%{opacity:.5}100%{transform:translateY(224px);opacity:.9}}
.pulse{animation:pulse 3s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.blink{animation:blink 1.1s infinite steps(1);}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
</style>
<linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e0b45"/><stop offset="1" stop-color="#05040b"/></linearGradient>
<linearGradient id="hz" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c084fc" stop-opacity="0"/><stop offset=".5" stop-color="#e9d5ff"/><stop offset="1" stop-color="#c084fc" stop-opacity="0"/></linearGradient>
<radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="#e9d5ff"/><stop offset=".65" stop-color="#a855f7"/><stop offset="1" stop-color="#6d28d9" stop-opacity="0"/></radialGradient>
<radialGradient id="aura" cx="50%" cy="100%" r="60%"><stop offset="0" stop-color="#7c3aed" stop-opacity=".5"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="c"><rect width="1200" height="220" rx="18"/></clipPath>
<clipPath id="floor"><rect y="70" width="1200" height="150"/></clipPath>
<clipPath id="sky"><rect width="1200" height="70"/></clipPath>
<pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".035"/></pattern>
</defs>
<g clip-path="url(#c)">
<rect width="1200" height="220" fill="#05040b"/>
<rect width="1200" height="70" fill="url(#aura)"/>
<g clip-path="url(#sky)"><circle class="pulse" cx="600" cy="78" r="46" fill="url(#sun)"/></g>
<rect y="70" width="1200" height="150" fill="url(#fl)"/>
<g clip-path="url(#floor)" stroke="#8b5cf6" stroke-width="1" opacity=".5"><line x1="-40" y1="70" x2="-1800" y2="220"/><line x1="0" y1="70" x2="-1650" y2="220"/><line x1="40" y1="70" x2="-1500" y2="220"/><line x1="80" y1="70" x2="-1350" y2="220"/><line x1="120" y1="70" x2="-1200" y2="220"/><line x1="160" y1="70" x2="-1050" y2="220"/><line x1="200" y1="70" x2="-900" y2="220"/><line x1="240" y1="70" x2="-750" y2="220"/><line x1="280" y1="70" x2="-600" y2="220"/><line x1="320" y1="70" x2="-450" y2="220"/><line x1="360" y1="70" x2="-300" y2="220"/><line x1="400" y1="70" x2="-150" y2="220"/><line x1="440" y1="70" x2="0" y2="220"/><line x1="480" y1="70" x2="150" y2="220"/><line x1="520" y1="70" x2="300" y2="220"/><line x1="560" y1="70" x2="450" y2="220"/><line x1="600" y1="70" x2="600" y2="220"/><line x1="640" y1="70" x2="750" y2="220"/><line x1="680" y1="70" x2="900" y2="220"/><line x1="720" y1="70" x2="1050" y2="220"/><line x1="760" y1="70" x2="1200" y2="220"/><line x1="800" y1="70" x2="1350" y2="220"/><line x1="840" y1="70" x2="1500" y2="220"/><line x1="880" y1="70" x2="1650" y2="220"/><line x1="920" y1="70" x2="1800" y2="220"/><line x1="960" y1="70" x2="1950" y2="220"/><line x1="1000" y1="70" x2="2100" y2="220"/><line x1="1040" y1="70" x2="2250" y2="220"/><line x1="1080" y1="70" x2="2400" y2="220"/><line x1="1120" y1="70" x2="2550" y2="220"/><line x1="1160" y1="70" x2="2700" y2="220"/><line x1="1200" y1="70" x2="2850" y2="220"/><line x1="1240" y1="70" x2="3000" y2="220"/><line class="hl" x1="0" y1="0" x2="1200" y2="0" style="animation-delay:0.00s"/><line class="hl" x1="0" y1="0" x2="1200" y2="0" style="animation-delay:-0.55s"/><line class="hl" x1="0" y1="0" x2="1200" y2="0" style="animation-delay:-1.10s"/><line class="hl" x1="0" y1="0" x2="1200" y2="0" style="animation-delay:-1.65s"/><line class="hl" x1="0" y1="0" x2="1200" y2="0" style="animation-delay:-2.20s"/></g>
<rect y="69" width="1200" height="2" fill="url(#hz)" filter="url(#glow)"/>
<g class="m" text-anchor="middle">
<text x="600" y="146" font-size="22" font-weight="700" letter-spacing="8" fill="#f5f3ff" filter="url(#glow)">[ END OF TRANSMISSION ]</text>
<text x="600" y="180" font-size="13" letter-spacing="4" fill="#a78bfa">thanks for scrolling — stay hypersonic<tspan class="blink" fill="#7dd3fc">_</tspan></text>
</g>
<rect width="1200" height="220" fill="url(#scanlines)"/>
</g>
<rect x=".5" y=".5" width="1199" height="219" rx="18" fill="none" stroke="#3b1d7a"/>
</svg>