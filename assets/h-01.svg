<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="72" viewBox="0 0 1200 72" role="img" aria-label="01 WHOAMI">
<title>01 // WHOAMI</title>
<defs><style>
.m{font-family:'JetBrains Mono','Fira Code','SF Mono','Cascadia Code',Consolas,'Liberation Mono','Courier New',monospace;}
.run{animation:run 3.2s cubic-bezier(.5,0,.2,1) infinite;}
@keyframes run{from{transform:translateX(270px);opacity:0}10%{opacity:1}85%{opacity:1}to{transform:translateX(1140px);opacity:0}}
.blink{animation:blink 1.1s infinite steps(1);}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
</style>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6"/><stop offset=".6" stop-color="#22d3ee" stop-opacity=".5"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
<linearGradient id="dot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7dd3fc" stop-opacity="0"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
<linearGradient id="num" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c084fc"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<clipPath id="c"><rect width="1200" height="72" rx="12"/></clipPath>
</defs>
<g clip-path="url(#c)">
<rect width="1200" height="72" fill="#0b0918"/>
<rect width="4" height="72" fill="url(#num)"/>
<text class="m" x="28" y="49" font-size="34" font-weight="800" fill="none" stroke="url(#num)" stroke-width="1.4">01</text>
<text class="m" x="118" y="46" font-size="24" font-weight="700" letter-spacing="7" fill="#f5f3ff"><tspan fill="#22d3ee">//</tspan> WHOAMI<tspan class="blink" fill="#7dd3fc">_</tspan></text>
<rect x="270" y="35" width="890" height="1.5" fill="url(#ln)"/>
<rect class="run" x="0" y="34" width="60" height="3.5" rx="2" fill="url(#dot)"/>
<text class="m" x="1160" y="26" text-anchor="end" font-size="11" letter-spacing="3" fill="#5b4a8a">sys.identity</text>
</g>
<rect x=".5" y=".5" width="1199" height="71" rx="12" fill="none" stroke="#2e1a5e"/>
</svg>