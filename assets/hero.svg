<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="KALI — Hypersonic Laboratories. 3D artist, designer, developer.">
  <title>KALI // Hypersonic Laboratories</title>
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code','SF Mono','Cascadia Code',Consolas,'Liberation Mono','Courier New',monospace; }
      .hud { font-size: 12px; letter-spacing: 3px; fill: #a78bfa; }
      .hud-dim { font-size: 12px; letter-spacing: 3px; fill: #6d5b9e; }

      /* glitch title */
      .gc { animation: gc 5s infinite steps(1); }
      .gm { animation: gm 5s infinite steps(1); }
      .gs { animation: gs 5s infinite steps(1); opacity: 0; }
      @keyframes gc { 0%,84%,100% { transform: translate(-3px,0); } 86% { transform: translate(-11px,3px); } 88% { transform: translate(7px,-2px); } 90% { transform: translate(-5px,1px); } 92% { transform: translate(-3px,0); } }
      @keyframes gm { 0%,84%,100% { transform: translate(3px,0); } 86% { transform: translate(10px,-3px); } 88% { transform: translate(-8px,2px); } 90% { transform: translate(5px,-1px); } 92% { transform: translate(3px,0); } }
      @keyframes gs { 0%,84%,94%,100% { opacity: 0; transform: translate(0,0); } 85% { opacity: 1; transform: translate(18px,0); } 87% { opacity: 1; transform: translate(-14px,0); } 89% { opacity: 1; transform: translate(9px,0); } 91% { opacity: 1; transform: translate(-6px,0); } }

      .blink { animation: blink 1.1s infinite steps(1); }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }

      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

      /* hypersonic speed streaks */
      .sp { animation: sp linear infinite; }
      @keyframes sp { from { transform: translateX(1300px); } to { transform: translateX(-500px); } }

      /* perspective floor */
      .hl { animation: hl 2.6s cubic-bezier(.6,0,1,.6) infinite; opacity: 0; }
      @keyframes hl { 0% { transform: translateY(338px); opacity: 0; } 15% { opacity: .55; } 100% { transform: translateY(424px); opacity: .9; } }

      .scan { animation: scan 7s linear infinite; }
      @keyframes scan { from { transform: translateY(-140px); } to { transform: translateY(440px); } }

      .meter { animation: meter 1.6s ease-in-out infinite; opacity: .15; }
      @keyframes meter { 0%,100% { opacity: .15; } 30%,60% { opacity: 1; } }

      .tw { animation: tw 3s ease-in-out infinite; }
      @keyframes tw { 0%,100% { opacity: .1; } 50% { opacity: .9; } }
    </style>

    <!-- KALI letterforms, hand-cut so they render identically everywhere -->
    <g id="logo">
      <path d="M0 0H20V110H8L0 102Z"/>
      <path d="M20 48L58 0H84L34 62H20Z"/>
      <path d="M30 52L84 110H58L20 70Z"/>
      <path fill-rule="evenodd" d="M100 110L132 0H156L188 110H166L159 86H129L122 110ZM134 68H154L144 30Z"/>
      <path d="M206 0H226V90H278V110H214L206 102Z"/>
      <path d="M296 0H316V110H296Z"/>
    </g>

    <linearGradient id="title" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="330" y2="110">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#e9d5ff"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>

    <radialGradient id="bg" cx="72%" cy="45%" r="75%">
      <stop offset="0" stop-color="#2a1458"/>
      <stop offset=".45" stop-color="#120a2a"/>
      <stop offset="1" stop-color="#05040b"/>
    </radialGradient>

    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a855f7" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#6d28d9" stop-opacity=".18"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="core" cx="45%" cy="42%" r="55%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".22" stop-color="#f5e8ff"/>
      <stop offset=".5" stop-color="#c084fc"/>
      <stop offset=".8" stop-color="#7e22ce"/>
      <stop offset="1" stop-color="#3b0764"/>
    </radialGradient>

    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e0b45"/>
      <stop offset="1" stop-color="#05040b"/>
    </linearGradient>

    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c084fc" stop-opacity="0"/>
      <stop offset=".5" stop-color="#e9d5ff"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset=".85" stop-color="#7dd3fc" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>

    <linearGradient id="streakP" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c084fc" stop-opacity="0"/>
      <stop offset=".85" stop-color="#c084fc" stop-opacity=".8"/>
      <stop offset="1" stop-color="#f5e8ff"/>
    </linearGradient>

    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset=".5" stop-color="#a78bfa" stop-opacity=".07"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset=".6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".6"/>
    </radialGradient>

    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity=".035"/>
    </pattern>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="frame"><rect width="1200" height="420" rx="18"/></clipPath>
    <clipPath id="floorClip"><rect x="0" y="338" width="1200" height="82"/></clipPath>
    <clipPath id="boot"><rect x="60" y="60" width="0" height="220"><animate attributeName="width" from="0" to="560" begin=".15s" dur="1.1s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/></rect></clipPath>
    <clipPath id="slice"><rect x="-20" y="30" width="400" height="22"><animate attributeName="y" values="30;72;14;88;46" dur="5s" calcMode="discrete" repeatCount="indefinite"/></rect></clipPath>

    <clipPath id="sub"><rect x="88" y="262" width="0" height="34"><animate attributeName="width" from="0" to="640" begin="1.1s" dur="1.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="p0"><rect x="112" y="300" width="0" height="26"><animate attributeName="width" values="0;520;520;0;0" keyTimes="0;.08;.22;.25;1" dur="16s" begin="2.8s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="p1"><rect x="112" y="300" width="0" height="26"><animate attributeName="width" values="0;520;520;0;0" keyTimes="0;.08;.22;.25;1" dur="16s" begin="6.8s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="p2"><rect x="112" y="300" width="0" height="26"><animate attributeName="width" values="0;520;520;0;0" keyTimes="0;.08;.22;.25;1" dur="16s" begin="10.8s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="p3"><rect x="112" y="300" width="0" height="26"><animate attributeName="width" values="0;520;520;0;0" keyTimes="0;.08;.22;.25;1" dur="16s" begin="14.8s" repeatCount="indefinite"/></rect></clipPath>

    <path id="orbit" d="M-178 0A178 46 0 1 0 178 0A178 46 0 1 0 -178 0"/>
  </defs>

  <g clip-path="url(#frame)">
    <!-- backdrop -->
    <rect width="1200" height="420" fill="url(#bg)"/>

    <!-- star dust -->
    <g fill="#e9d5ff">
      <circle class="tw" cx="640" cy="60" r="1.2" style="animation-delay:-.4s"/>
      <circle class="tw" cx="700" cy="130" r="1" style="animation-delay:-1.2s"/>
      <circle class="tw" cx="1110" cy="120" r="1.4" style="animation-delay:-2.1s"/>
      <circle class="tw" cx="1040" cy="300" r="1" style="animation-delay:-.9s"/>
      <circle class="tw" cx="760" cy="300" r="1.3" style="animation-delay:-2.6s"/>
      <circle class="tw" cx="560" cy="210" r="1" style="animation-delay:-1.7s"/>
      <circle class="tw" cx="1150" cy="230" r="1.1" style="animation-delay:-.2s"/>
      <circle class="tw" cx="820" cy="40" r="1.2" style="animation-delay:-2.3s"/>
      <circle class="tw" cx="980" cy="70" r="1" style="animation-delay:-1.4s"/>
      <circle class="tw" cx="420" cy="40" r="1" style="animation-delay:-.7s"/>
    </g>

    <!-- hypersonic streaks -->
    <g opacity=".7">
      <rect class="sp" x="0" y="74"  width="260" height="1.5" fill="url(#streak)"  style="animation-duration:1.9s;animation-delay:-.3s"/>
      <rect class="sp" x="0" y="142" width="180" height="1"   fill="url(#streakP)" style="animation-duration:1.4s;animation-delay:-1.1s"/>
      <rect class="sp" x="0" y="188" width="320" height="1.5" fill="url(#streak)"  style="animation-duration:2.3s;animation-delay:-.8s"/>
      <rect class="sp" x="0" y="236" width="140" height="1"   fill="url(#streakP)" style="animation-duration:1.2s;animation-delay:-.5s"/>
      <rect class="sp" x="0" y="112" width="220" height="1"   fill="url(#streakP)" style="animation-duration:2.6s;animation-delay:-2s"/>
      <rect class="sp" x="0" y="296" width="280" height="1.5" fill="url(#streak)"  style="animation-duration:1.7s;animation-delay:-1.5s"/>
      <rect class="sp" x="0" y="46"  width="160" height="1"   fill="url(#streak)"  style="animation-duration:2.1s;animation-delay:-1.8s"/>
      <rect class="sp" x="0" y="262" width="200" height="1"   fill="url(#streakP)" style="animation-duration:1.5s;animation-delay:-.1s"/>
    </g>

    <!-- perspective floor -->
    <rect x="0" y="338" width="1200" height="82" fill="url(#floor)"/>
    <g clip-path="url(#floorClip)" stroke="#8b5cf6" stroke-width="1" opacity=".55">
      <line x1="600" y1="338" x2="600" y2="420"/>
      <line x1="656.9" y1="338" x2="710" y2="420"/><line x1="543.1" y1="338" x2="490" y2="420"/>
      <line x1="713.9" y1="338" x2="820" y2="420"/><line x1="486.1" y1="338" x2="380" y2="420"/>
      <line x1="770.8" y1="338" x2="930" y2="420"/><line x1="429.2" y1="338" x2="270" y2="420"/>
      <line x1="827.8" y1="338" x2="1040" y2="420"/><line x1="372.2" y1="338" x2="160" y2="420"/>
      <line x1="884.7" y1="338" x2="1150" y2="420"/><line x1="315.3" y1="338" x2="50" y2="420"/>
      <line x1="941.6" y1="338" x2="1260" y2="420"/><line x1="258.4" y1="338" x2="-60" y2="420"/>
      <line x1="998.6" y1="338" x2="1370" y2="420"/><line x1="201.4" y1="338" x2="-170" y2="420"/>
      <line x1="1055.5" y1="338" x2="1480" y2="420"/><line x1="144.5" y1="338" x2="-280" y2="420"/>
      <line x1="1112.5" y1="338" x2="1590" y2="420"/><line x1="87.5" y1="338" x2="-390" y2="420"/>
      <line x1="1169.4" y1="338" x2="1700" y2="420"/><line x1="30.6" y1="338" x2="-500" y2="420"/>
      <line class="hl" x1="0" y1="0" x2="1200" y2="0" style="animation-delay:0s"/>
      <line class="hl" x1="0" y1="0" x2="1200" y2="0" style="animation-delay:-.52s"/>
      <line class="hl" x1="0" y1="0" x2="1200" y2="0" style="animation-delay:-1.04s"/>
      <line class="hl" x1="0" y1="0" x2="1200" y2="0" style="animation-delay:-1.56s"/>
      <line class="hl" x1="0" y1="0" x2="1200" y2="0" style="animation-delay:-2.08s"/>
    </g>

    <!-- HOLLOW PURPLE: blue + red collapsing into one core -->
    <g transform="translate(905 200)">
      <circle r="210" fill="url(#aura)"/>

      <!-- targeting reticle -->
      <g stroke="#a78bfa" fill="none" opacity=".45">
        <circle r="128" stroke-width="1" stroke-dasharray="3 9"/>
        <g stroke-width="2">
          <line x1="0" y1="-140" x2="0" y2="-120"/><line x1="0" y1="120" x2="0" y2="140"/>
          <line x1="-140" y1="0" x2="-120" y2="0"/><line x1="120" y1="0" x2="140" y2="0"/>
        </g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
      </g>
      <circle r="92" fill="none" stroke="#7dd3fc" stroke-width="1" stroke-dasharray="1 7" opacity=".6">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
      </circle>

      <!-- orbital rings -->
      <g fill="none" stroke-width="1.2">
        <g transform="rotate(-24)"><use href="#orbit" xlink:href="#orbit" stroke="#7dd3fc" opacity=".45" stroke-dasharray="40 14"><animate attributeName="stroke-dashoffset" from="0" to="-216" dur="4s" repeatCount="indefinite"/></use></g>
        <g transform="rotate(34)"><use href="#orbit" xlink:href="#orbit" stroke="#fb7185" opacity=".38" stroke-dasharray="26 18"><animate attributeName="stroke-dashoffset" from="0" to="216" dur="5s" repeatCount="indefinite"/></use></g>
        <g transform="rotate(84)"><use href="#orbit" xlink:href="#orbit" stroke="#c084fc" opacity=".35" stroke-dasharray="6 10"/></g>
      </g>

      <!-- core -->
      <circle r="60" fill="url(#core)" filter="url(#glow)">
        <animate attributeName="r" values="56;64;56" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle r="60" fill="none" stroke="#f5e8ff" stroke-width="1.5" opacity=".6">
        <animate attributeName="r" values="60;120" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".6;0" dur="3.2s" repeatCount="indefinite"/>
      </circle>

      <!-- blue (attraction) and red (repulsion) orbiting -->
      <g transform="rotate(-24)">
        <circle r="8" fill="#38bdf8" filter="url(#glow)">
          <animateMotion dur="5s" repeatCount="indefinite" rotate="auto"><mpath href="#orbit" xlink:href="#orbit"/></animateMotion>
        </circle>
      </g>
      <g transform="rotate(34)">
        <circle r="8" fill="#f43f5e" filter="url(#glow)">
          <animateMotion dur="6.5s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#orbit" xlink:href="#orbit"/></animateMotion>
        </circle>
      </g>
    </g>

    <!-- horizon glow -->
    <rect x="0" y="337" width="1200" height="2" fill="url(#horizon)" filter="url(#softglow)"/>

    <!-- title block -->
    <g class="mono">
      <rect x="92" y="78" width="8" height="8" fill="#7dd3fc"/>
      <text x="110" y="87" class="hud">HYPERSONIC_LABORATORIES</text>
      <text x="420" y="87" class="hud-dim">ID:1KALIEL</text>
    </g>

    <g clip-path="url(#boot)">
      <g transform="translate(92 110) scale(1.2)">
        <use href="#logo" xlink:href="#logo" class="gc" fill="#22d3ee" opacity=".75"/>
        <use href="#logo" xlink:href="#logo" class="gm" fill="#f43f5e" opacity=".7"/>
        <use href="#logo" xlink:href="#logo" fill="url(#title)"/>
        <g clip-path="url(#slice)"><use href="#logo" xlink:href="#logo" class="gs" fill="#e9d5ff"/></g>
        <rect class="blink" x="334" y="92" width="26" height="18" fill="#7dd3fc"/>
      </g>
    </g>

    <g class="mono">
      <g clip-path="url(#sub)">
        <text x="92" y="286" font-size="19" letter-spacing="5" fill="#d8b4fe" font-weight="600">3D ARTIST  ·  DESIGNER  ·  DEVELOPER</text>
      </g>

      <text x="92" y="318" font-size="15" fill="#22d3ee" font-weight="700">&gt;</text>
      <g font-size="15" fill="#a5a3c9">
        <g clip-path="url(#p0)"><text x="112" y="318">forging <tspan fill="#e9d5ff">FORGE</tspan> — a fantasy framework for HELIX</text></g>
        <g clip-path="url(#p1)"><text x="112" y="318">compiling at <tspan fill="#e9d5ff">42</tspan> — C, pointers &amp; push_swap</text></g>
        <g clip-path="url(#p2)"><text x="112" y="318">mapping <tspan fill="#e9d5ff">Hogwarts Legacy</tspan> internals for modders</text></g>
        <g clip-path="url(#p3)"><text x="112" y="318">rendering worlds in <tspan fill="#e9d5ff">Blender</tspan> past 3 a.m.</text></g>
      </g>
    </g>

    <!-- HUD -->
    <g fill="none" stroke="#a78bfa" stroke-width="2" opacity=".75">
      <path d="M22 52V22H52"/><path d="M1148 22H1178V52"/>
      <path d="M22 368V398H52"/><path d="M1148 398H1178V368"/>
    </g>
    <g class="mono">
      <circle class="pulse" cx="1036" cy="45" r="4" fill="#4ade80"/>
      <text x="1156" y="49" class="hud" text-anchor="end">SYS ONLINE</text>
      <text x="44" y="392" class="hud-dim">LOC BR // UTC-03:00</text>
      <text x="868" y="392" class="hud-dim" text-anchor="end">VELOCITY</text>
      <g fill="#7dd3fc">
        <rect class="meter" x="884" y="382" width="14" height="10" style="animation-delay:0s"/>
        <rect class="meter" x="902" y="382" width="14" height="10" style="animation-delay:.08s"/>
        <rect class="meter" x="920" y="382" width="14" height="10" style="animation-delay:.16s"/>
        <rect class="meter" x="938" y="382" width="14" height="10" style="animation-delay:.24s"/>
        <rect class="meter" x="956" y="382" width="14" height="10" style="animation-delay:.32s"/>
        <rect class="meter" x="974" y="382" width="14" height="10" style="animation-delay:.40s" fill="#c084fc"/>
        <rect class="meter" x="992" y="382" width="14" height="10" style="animation-delay:.48s" fill="#c084fc"/>
        <rect class="meter" x="1010" y="382" width="14" height="10" style="animation-delay:.56s" fill="#f43f5e"/>
      </g>
      <text x="1156" y="392" class="hud" text-anchor="end" fill="#e9d5ff">MACH 5+</text>
    </g>

    <!-- CRT finish -->
    <rect class="scan" x="0" y="0" width="1200" height="120" fill="url(#band)"/>
    <rect width="1200" height="420" fill="url(#scanlines)"/>
    <rect width="1200" height="420" fill="url(#vignette)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="419" rx="18" fill="none" stroke="#3b1d7a" stroke-width="1"/>
</svg>
